name: atlas-knowledge-frontend

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8082:80"
    environment:
      PORT: 80
      PUBLISH_PORT: "8082"
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8080}
      VITE_API_URL: /api/v1
      TERM: xterm-256color
      FORCE_COLOR: "1"
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
